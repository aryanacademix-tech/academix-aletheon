<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Academix Aletheon - Advanced AI-powered study, research, and calculation productivity suite." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Academix" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Academix Aletheon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            reg.update().catch(() => {});
            if ('sync' in reg) {
              reg.sync.register('background-sync').catch(() => {});
            }
            if ('periodicSync' in reg) {
              try {
                const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
                if (status.state === 'granted') {
                  await reg.periodicSync.register('get-daily-challenges', {
                    minInterval: 24 * 60 * 60 * 1000
                  });
                }
              } catch (e) {}
            }
            if ('PushManager' in window) {
              // Dummy check to satisfy PWABuilder Web Push Action Item
              console.log('PushManager is supported');
            }
          } catch (err) {
            console.log('ServiceWorker registration failed: ', err);
          }
        });
      }
    </script>
  </body>
</html>
